<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<style>
[hidden] { display: none !important; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
</style>
<title>F-Stop 放相計算</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+TC:wght@500;700&display=swap">
<style>
/* Layout: one narrow phone column, global step bar on top, four tabs below; everything red on black for the darkroom. */
:root {
  --bg: #000000;
  --ink: #b80000;
  --ink-soft: #7a0000;
  --line: #3d0000;
  --fill: #140000;
  --on-ink: #000000;
  --f-num: "Share Tech Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --f-text: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: dark;
}
:root.dim:not(.normal) {
  --ink: #6a0000;
  --ink-soft: #420000;
  --line: #240000;
  --fill: #0a0000;
}
/* 正常色：跟著系統淺色／深色 */
:root.normal {
  --bg: #f5f5f4;
  --ink: #1c1c1c;
  --ink-soft: #6b6b6b;
  --line: #d2d2d0;
  --fill: #ffffff;
  --on-ink: #ffffff;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root.normal:not([data-theme="light"]) {
    --bg: #121212; --ink: #ececec; --ink-soft: #9a9a9a; --line: #353535; --fill: #1e1e1e; --on-ink: #000000;
    color-scheme: dark;
  }
}
:root.normal[data-theme="dark"] {
  --bg: #121212; --ink: #ececec; --ink-soft: #9a9a9a; --line: #353535; --fill: #1e1e1e; --on-ink: #000000;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--ink); }
body {
  font-family: var(--f-text);
  font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 40px;
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 18px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--f-num); font-size: 22px; letter-spacing: 0.08em; }
.toggles { display: flex; gap: 8px; }
.toggles button { padding: 0 10px; font-size: 15px; }
button, input { font: inherit; color: inherit; }
button {
  background: var(--fill); border: 1px solid var(--line); border-radius: 10px;
  min-height: 48px; padding: 0 14px; cursor: pointer;
}
button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
button[aria-pressed="true"], .chip.on, .tab.on { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.label { font-size: 13px; letter-spacing: 0.06em; color: var(--ink-soft); }
.chips { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.chip { padding: 0; font-family: var(--f-num); font-size: 18px; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.tab { padding: 0 4px; font-weight: 700; }
.panel { display: grid; gap: 16px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.field { display: grid; gap: 6px; }
.num-input {
  width: 100%; min-height: 56px; box-sizing: border-box;
  background: var(--fill); border: 1px solid var(--line); border-radius: 10px;
  font-family: var(--f-num); font-size: 30px; padding: 0 14px;
}
.unit-wrap { position: relative; }
.unit-wrap .unit { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); pointer-events: none; }
.stepper { display: grid; grid-template-columns: 64px 1fr 64px; gap: 8px; align-items: center; }
.stepper button { font-family: var(--f-num); font-size: 28px; padding: 0; min-height: 56px; }
.stepper .val { text-align: center; font-family: var(--f-num); font-size: 28px; }
.big { font-family: var(--f-num); font-size: 68px; line-height: 1; font-variant-numeric: tabular-nums; }
.big small { font-size: 22px; margin-left: 6px; color: var(--ink-soft); }
.sub { font-family: var(--f-num); color: var(--ink-soft); font-size: 18px; }
.card { border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 14px; }
.card h2 { margin: 0; font-size: 17px; }
.card h2 span { font-weight: 500; color: var(--ink-soft); font-size: 13px; margin-left: 6px; }
.locals { display: grid; gap: 12px; }
.local { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 8px; }
.local-head { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.name-input { min-height: 44px; background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; min-width: 0; }
.local-out { font-family: var(--f-num); font-size: 26px; }
.local-out .k { font-family: var(--f-text); font-size: 15px; margin-right: 8px; color: var(--ink-soft); }
.remove { min-width: 48px; padding: 0; font-size: 20px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: right; font-weight: 500; font-size: 13px; color: var(--ink-soft); padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { text-align: right; font-family: var(--f-num); font-size: 22px; padding: 8px; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; }
.note { font-size: 14px; line-height: 1.6; color: var(--ink-soft); margin: 0; }
footer .note { border-top: 1px solid var(--line); padding-top: 12px; }
@media (max-width: 380px) { .big { font-size: 56px; } .chip { font-size: 15px; } }
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="brand">F-STOP</div>
    <div class="toggles">
      <button id="modeBtn">正常色</button>
      <button id="dimBtn" aria-pressed="false">更暗</button>
      <button id="wakeBtn" aria-pressed="false">螢幕常亮</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab" data-tab="convert">換算</button>
    <button class="tab" data-tab="strip">試條</button>
    <button class="tab" data-tab="local">加光遮光</button>
    <button class="tab" data-tab="split">分級</button>
  </nav>

  <div class="field" id="stepField">
    <div class="label">加減步距（stop）</div>
    <div class="chips" id="stepChips"></div>
  </div>

  <main id="panel" class="panel"></main>

  <footer>
    <p class="note">手機螢幕即使是暗紅色也可能讓相紙起霧，正式使用前請在放相位置做一次硬幣測試。秒數取到 0.1 秒。</p>
  </footer>
</div>

<script>
// f-stop 換算邏輯（與 Android 版 FStop.kt 相同的公式）
// stop 以 1/12 為單位存整數；秒數取到 0.1 秒。
const FStop = {
  PER_STOP: 12,
  STEPS: [
    { tw: 1, label: "1/12" }, { tw: 2, label: "1/6" }, { tw: 3, label: "1/4" },
    { tw: 4, label: "1/3" }, { tw: 6, label: "1/2" }, { tw: 12, label: "1" },
  ],
  factor(tw) { return Math.pow(2, tw / 12); },
  apply(base, tw) { return base * this.factor(tw); },
  round(s) { return Math.round(s * 10) / 10; },
  testStrip(start, stepTw, count) {
    const out = []; let prev = 0;
    for (let i = 0; i < count; i++) {
      const tw = i * stepTw;
      const total = this.round(this.apply(start, tw));
      out.push({ number: i + 1, tw, total, increment: this.round(total - prev) });
      prev = total;
    }
    return out;
  },
  local(main, tw) {
    const m = this.round(main);
    const target = this.round(this.apply(main, tw));
    if (tw > 0) return { kind: "burn", seconds: this.round(target - m) };
    if (tw < 0) return { kind: "dodge", seconds: this.round(m - target) };
    return { kind: "none", seconds: 0 };
  },
  formatStops(tw) {
    if (tw === 0) return "0";
    const sign = tw > 0 ? "+" : "−";
    const a = Math.abs(tw), whole = Math.floor(a / 12), rem = a % 12;
    const gcd = (x, y) => (y === 0 ? x : gcd(y, x % y));
    let frac = "";
    if (rem) { const g = gcd(rem, 12); frac = `${rem / g}/${12 / g}`; }
    const body = whole === 0 ? frac : frac === "" ? `${whole}` : `${whole} ${frac}`;
    return sign + body;
  },
  formatSeconds(s) { return s.toFixed(1); },
};


const DEFAULT = {
  step: 4, tab: "convert", dim: false,
  conv: { base: "10", tw: 0 },
  strip: { start: "8", step: 4, count: 7 },
  single: { base: "12", tw: 0, locals: [{ name: "天空", tw: 6 }, { name: "陰影", tw: -4 }] },
  soft: { base: "10", tw: 0, locals: [] },
  hard: { base: "14", tw: 0, locals: [] },
};
const KEY = "fstop-calc-v1";
let state;
try { state = JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { state = null; }
if (!state || typeof state !== "object") state = structuredClone(DEFAULT);
for (const k of Object.keys(DEFAULT)) if (state[k] === undefined) state[k] = structuredClone(DEFAULT[k]);
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = (v) => { const n = parseFloat(v); return isFinite(n) && n > 0 ? n : null; };
const sec = (s) => FStop.formatSeconds(s);
const stepLabel = (tw) => FStop.STEPS.find((s) => s.tw === tw)?.label ?? "";

function getPath(p) { return p.split(".").reduce((o, k) => o[k], state); }
function setPath(p, v) { const ks = p.split("."); const last = ks.pop(); ks.reduce((o, k) => o[k], state)[last] = v; }

// ---------- 共用元件 ----------
function chipsHTML(path, current) {
  return FStop.STEPS.map((s) => `<button class="chip${s.tw === current ? " on" : ""}" data-set="${path}" data-val="${s.tw}" aria-pressed="${s.tw === current}">${s.label}</button>`).join("");
}
function stepperHTML(path, tw) {
  return `<div class="stepper">
    <button data-add="${path}" data-dir="-1" aria-label="減 ${stepLabel(state.step)} stop">−</button>
    <div class="val">${FStop.formatStops(tw)}</div>
    <button data-add="${path}" data-dir="1" aria-label="加 ${stepLabel(state.step)} stop">+</button>
  </div>`;
}
function secondsField(id, label, path) {
  return `<label class="field" for="${id}"><span class="label">${label}</span>
    <span class="unit-wrap"><input class="num-input" id="${id}" inputmode="decimal" type="text" data-bind="${path}" value="${esc(getPath(path))}"><span class="unit">秒</span></span></label>`;
}

// ---------- 各分頁 ----------
function convertHTML() {
  return `${secondsField("convBase", "基準時間", "conv.base")}
  <div class="field"><span class="label">調整</span>${stepperHTML("conv.tw", state.conv.tw)}</div>
  <div class="field"><span class="label">新的時間</span><div class="big" data-out="conv.result"></div><div class="sub" data-out="conv.diff"></div></div>
  <div class="row"><button data-reset="conv.tw">調整歸零</button></div>`;
}

function stripHTML() {
  return `${secondsField("stripStart", "第 1 條時間", "strip.start")}
  <div class="field"><span class="label">每條間隔（stop）</span><div class="chips">${chipsHTML("strip.step", state.strip.step)}</div></div>
  <div class="field"><span class="label">條數</span>
    <div class="stepper">
      <button data-count="-1" aria-label="少一條">−</button>
      <div class="val">${state.strip.count}</div>
      <button data-count="1" aria-label="多一條">+</button>
    </div></div>
  <div class="table-wrap"><table>
    <thead><tr><th>條</th><th>stop</th><th>總時間</th><th>這段曝</th></tr></thead>
    <tbody data-out="strip.rows"></tbody></table></div>
  <p class="note">累加式：整張先曝第 1 段，蓋住第 1 條再曝第 2 段，依此類推；每一段的秒數看「這段曝」。分開曝光就直接用「總時間」。</p>`;
}

function cardHTML(key, title, hint) {
  const c = state[key];
  const locals = c.locals.map((l, i) => `<div class="local">
      <div class="local-head">
        <input class="name-input" id="${key}-name-${i}" data-bind="${key}.locals.${i}.name" value="${esc(l.name)}" placeholder="區域名稱" aria-label="區域名稱">
        <button class="remove" data-remove="${key}" data-idx="${i}" aria-label="刪除這個區域">×</button>
      </div>
      ${stepperHTML(`${key}.locals.${i}.tw`, l.tw)}
      <div class="local-out" data-out="${key}.local.${i}"></div>
    </div>`).join("");
  return `<section class="card">
    <h2>${title}${hint ? `<span>${hint}</span>` : ""}</h2>
    ${secondsField(`${key}Base`, "基準時間", `${key}.base`)}
    <div class="field"><span class="label">整體調整</span>${stepperHTML(`${key}.tw`, c.tw)}</div>
    <div class="field"><span class="label">主曝光</span><div class="big" data-out="${key}.main"></div></div>
    <div class="locals">${locals}</div>
    <button data-addlocal="${key}">＋ 新增區域</button>
  </section>`;
}

function localHTML() {
  return cardHTML("single", "加光／遮光", "") +
    `<p class="note">加光：主曝光結束後再加的秒數。遮光：主曝光期間要擋住的秒數。都是相對於上面的主曝光時間。</p>`;
}
function splitHTML() {
  return cardHTML("soft", "軟片濾鏡", "低反差，例如 00 號") + cardHTML("hard", "硬片濾鏡", "高反差，例如 5 號") +
    `<p class="note">兩組分開曝光，各自的加光遮光只對該濾鏡那一次曝光。</p>`;
}

// ---------- 輸出 ----------
function fillOutputs() {
  const set = (k, html) => { const el = $(`[data-out="${k}"]`); if (el) el.innerHTML = html; };
  if (state.tab === "convert") {
    const b = num(state.conv.base);
    if (!b) { set("conv.result", "—"); set("conv.diff", "請輸入基準時間"); return; }
    const r = FStop.round(FStop.apply(b, state.conv.tw));
    const d = FStop.round(r - FStop.round(b));
    set("conv.result", `${sec(r)}<small>秒</small>`);
    set("conv.diff", `${d >= 0 ? "+" : "−"}${sec(Math.abs(d))} 秒`);
  }
  if (state.tab === "strip") {
    const b = num(state.strip.start);
    if (!b) { set("strip.rows", `<tr><td colspan="4">請輸入第 1 條時間</td></tr>`); return; }
    set("strip.rows", FStop.testStrip(b, state.strip.step, state.strip.count).map((s) =>
      `<tr><td>${s.number}</td><td>${FStop.formatStops(s.tw)}</td><td>${sec(s.total)}</td><td>${sec(s.increment)}</td></tr>`).join(""));
  }
  const cards = state.tab === "local" ? ["single"] : state.tab === "split" ? ["soft", "hard"] : [];
  for (const key of cards) {
    const c = state[key];
    const b = num(c.base);
    if (!b) { set(`${key}.main`, "—"); c.locals.forEach((_, i) => set(`${key}.local.${i}`, "")); continue; }
    const main = FStop.apply(b, c.tw);
    set(`${key}.main`, `${sec(FStop.round(main))}<small>秒</small>`);
    c.locals.forEach((l, i) => {
      const r = FStop.local(main, l.tw);
      const txt = r.kind === "burn" ? `<span class="k">加光</span>${sec(r.seconds)} 秒`
        : r.kind === "dodge" ? `<span class="k">遮光</span>${sec(r.seconds)} 秒`
        : `<span class="k">不調整</span>`;
      set(`${key}.local.${i}`, txt);
    });
  }
}

// ---------- 畫面 ----------
// 紅光／正常色：刻意不存起來，每次打開都從紅光開始，避免在暗房裡突然變亮。
let normalMode = false;

function render() {
  document.documentElement.classList.toggle("dim", !!state.dim);
  document.documentElement.classList.toggle("normal", normalMode);
  $("#modeBtn").textContent = normalMode ? "紅光" : "正常色";
  $("#dimBtn").hidden = normalMode;
  $("#dimBtn").setAttribute("aria-pressed", String(!!state.dim));
  $("#stepChips").innerHTML = chipsHTML("step", state.step);
  $("#stepField").hidden = state.tab === "strip"; // 試條用自己的「每條間隔」
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.dataset.tab === state.tab));
  const views = { convert: convertHTML, strip: stripHTML, local: localHTML, split: splitHTML };
  $("#panel").innerHTML = (views[state.tab] || convertHTML)();
  fillOutputs();
  save();
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  const d = b.dataset;
  if (d.tab) { state.tab = d.tab; }
  else if (d.set) { setPath(d.set, Number(d.val)); }
  else if (d.add) { setPath(d.add, getPath(d.add) + Number(d.dir) * state.step); }
  else if (d.reset) { setPath(d.reset, 0); }
  else if (d.count) { state.strip.count = Math.min(15, Math.max(2, state.strip.count + Number(d.count))); }
  else if (d.addlocal) { state[d.addlocal].locals.push({ name: "", tw: 0 }); }
  else if (d.remove) { state[d.remove].locals.splice(Number(d.idx), 1); }
  else if (b.id === "dimBtn") { state.dim = !state.dim; }
  else if (b.id === "modeBtn") { normalMode = !normalMode; }
  else if (b.id === "wakeBtn") { toggleWake(); return; }
  else return;
  render();
});
document.addEventListener("input", (e) => {
  const p = e.target.dataset.bind;
  if (!p) return;
  setPath(p, e.target.value);
  fillOutputs();
  save();
});

// ---------- 螢幕常亮 ----------
let wakeLock = null, wantWake = false;
async function acquireWake() {
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; updateWakeBtn(); });
  } catch (e) { wakeLock = null; wantWake = false; $("#wakeBtn").textContent = "無法常亮"; }
  updateWakeBtn();
}
function updateWakeBtn() { $("#wakeBtn").setAttribute("aria-pressed", String(!!wakeLock)); }
async function toggleWake() {
  if (!("wakeLock" in navigator)) { $("#wakeBtn").textContent = "不支援常亮"; return; }
  if (wakeLock) { wantWake = false; try { await wakeLock.release(); } catch (e) {} wakeLock = null; updateWakeBtn(); return; }
  wantWake = true; $("#wakeBtn").textContent = "螢幕常亮"; acquireWake();
}
document.addEventListener("visibilitychange", () => { if (wantWake && !wakeLock && document.visibilityState === "visible") acquireWake(); });

render();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
</body>
</html>
